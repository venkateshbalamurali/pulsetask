<html lang="en">

</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Helper Icon Component (Inline SVGs) ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        kanban: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />,
        list: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />,
        gantt: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
        calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5aHere is a single, self-contained `index.html` file containing the application.

It loads Tailwind CSS, React, Babel, and inline SVG icons so it can run inside any web browser without needing `npm`, Node.js, or build tools.

### `index.html`

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Workspace - Monday & ClickUp Style</title>
  
  <!-- Tailwind CSS -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  
  <!-- React & React DOM -->
  <script crossorigin src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)"></script>
  <script crossorigin src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)"></script>
  
  <!-- Babel standalone for JSX compilation -->
  <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icon Component helper
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        kanban: <path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 3v4h12V6H6zm0 6v6h5v-6H6z"/>,
        list: <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>,
        timeline: <path d="M3 3v18h18M7 16l4-4 4 4 5-6"/>,
        calendar: <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18"/>,
        plus: <path d="M12 5v14M5 12h14"/>,
        search: <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>,
        sun: <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>,
        moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
        trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>,
        check: <polyline points="20 6 9 17 4 12"/>,
        user: <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      };
      
      return (
        <svg 
          xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name] || <circle cx="12" cy="12" r="10"/>}
        </svg>
      );
    };

    const INITIAL_TASKS = [
      { id: '1', title: 'Design Landing Page Wireframes', status: 'In Progress', priority: 'High', assignee: 'Alex', dueDate: '2026-10-10', progress: 60, tag: 'Design' },
      { id: '2', title: 'Setup Firebase Firestore Schema', status: 'Done', priority: 'Critical', assignee: 'Sam', dueDate: '2026-10-04', progress: 100, tag: 'Backend' },
      { id: '3', title: 'Integrate Gantt Chart View', status: 'To Do', priority: 'Medium', assignee: 'Jordan', dueDate: '2026-10-18', progress: 0, tag: 'Frontend' },
      { id: '4', title: 'Prepare User Onboarding Tour', status: 'Stuck', priority: 'Low', assignee: 'Taylor', dueDate: '2026-10-12', progress: 20, tag: 'Marketing' }
    ];

    const STATUSES = [
      { name: 'To Do', color: 'bg-gray-100 text-gray-700 border-gray-300' },
      { name: 'In Progress', color: 'bg-blue-100 text-blue-700 border-blue-300' },
      { name: 'Stuck', color: 'bg-red-100 text-red-700 border-red-300' },
      { name: 'Done', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' }
    ];

    const App = () => {
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('app_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });
      const [view, setView] = useState('kanban');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('All');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState('');

      useEffect(() => {
        localStorage.setItem('app_tasks', JSON.stringify(tasks));
      }, [tasks]);

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.tag.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesStatus = filterStatus === 'All' || t.status === filterStatus;
          return matchesSearch && matchesStatus;
        });
      }, [tasks, searchQuery, filterStatus]);

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          title: newTaskTitle,
          status: 'To Do',
          priority: 'Medium',
          assignee: 'You',
          dueDate: new Date().toISOString().split('T')[0],
          progress: 0,
          tag: 'General'
        };
        setTasks([newTask, ...tasks]);
        setNewTaskTitle('');
      };

      const updateTaskStatus = (id, newStatus) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, status: newStatus, progress: newStatus === 'Done' ? 100 : t.progress } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      return (
        <div className={`min-h-screen flex flex-col ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-gray-50 text-gray-900'}`}>
          {/* Header */}
          <header className={`px-6 py-4 border-b flex flex-wrap items-center justify-between gap-4 ${isDarkMode ? 'border-slate-800 bg-slate-900' : 'border-gray-200 bg-white'}`}>
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
                W
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight">Project AI Workspace</h1>
                <p className="text-xs text-gray-500 dark:text-slate-400">Personal Management Dashboard</p>
              </div>
            </div>

            {/* Global Search & Dark Mode Toggle */}
            <div className="flex items-center gap-3">
              <div className="relative">
                <Icon className="w-4 h-4 absolute left-3 top-2.5 text-gray-400" name="search"/>
                <input
                  type="text"
                  placeholder="Search tasks or tags..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className={`pl-9 pr-4 py-2 text-sm rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-400' : 'bg-gray-50 border-gray-200'}`}
                />
              </div>

              <button
                onClick={() => setIsDarkMode(!isDarkMode)}
                className={`p-2 rounded-lg border transition-colors ${isDarkMode ? 'border-slate-700 bg-slate-800 text-yellow-400' : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-100'}`}
              >
                <Icon 'moon'} 'sun' : ? className="w-5 h-5" name="{isDarkMode"/>
              </button>
            </div>
          </header>

          {/* Navigation Bar */}
          <div className={`px-6 border-b flex items-center justify-between gap-4 overflow-x-auto ${isDarkMode ? 'border-slate-800 bg-slate-900' : 'border-gray-200 bg-white'}`}>
            <div className="flex items-center space-x-1">
              {[
                { id: 'kanban', label: 'Kanban Board', icon: 'kanban' },
                { id: 'list', label: 'List Table', icon: 'list' },
                { id: 'timeline', label: 'Gantt Timeline', icon: 'timeline' },
                { id: 'calendar', label: 'Calendar Grid', icon: 'calendar' }
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setView(tab.id)}
                  className={`flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${
                    view === tab.id
                      ? 'border-indigo-600 text-indigo-600 font-semibold'
                      : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-slate-400'
                  }`}
                >
                  <Icon className="w-4 h-4" name="{tab.icon}"/>
                  {tab.label}
                </button>
              ))}
            </div>

            {/* Add Task Quick Form */}
            <form onSubmit={handleAddTask} className="flex items-center gap-2 py-2">
              <input
                type="text"
                placeholder="New task title..."
                value={newTaskTitle}
                onChange={(e) => setNewTaskTitle(e.target.value)}
                className={`px-3 py-1.5 text-sm rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-500 ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-gray-200'}`}
              />
              <button
                type="submit"
                className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg shadow-sm transition-all"
              >
                <Icon className="w-4 h-4" name="plus"/> Add
              </button>
            </form>
          </div>

          {/* View Container */}
          <main className="flex-1 p-6 overflow-auto">
            {/* 1. KANBAN VIEW */}
            {view === 'kanban' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                {STATUSES.map(s => {
                  const statusTasks = filteredTasks.filter(t => t.status === s.name);
                  return (
                    <div key={s.name} className={`p-4 rounded-xl border flex flex-col gap-3 ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-gray-100/70 border-gray-200'}`}>
                      <div className="flex items-center justify-between font-semibold">
                        <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${s.color}`}>
                          {s.name}
                        </span>
                        <span className="text-xs text-gray-400 font-normal">{statusTasks.length} tasks</span>
                      </div>

                      <div className="flex flex-col gap-3 min-h-[200px]">
                        {statusTasks.map(t => (
                          <div key={t.id} className={`p-4 rounded-lg border shadow-sm transition-all hover:shadow-md flex flex-col gap-3 ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200'}`}>
                            <div className="flex justify-between items-start">
                              <h3 className="font-medium text-sm line-clamp-2">{t.title}</h3>
                              <button onClick={() => deleteTask(t.id)} className="text-gray-400 hover:text-red-500">
                                <Icon className="w-4 h-4" name="trash"/>
                              </button>
                            </div>

                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 text-[10px] font-semibold bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 rounded">
                                {t.tag}
                              </span>
                              <span className="text-xs text-gray-400">{t.dueDate}</span>
                            </div>

                            {/* Progress bar */}
                            <div className="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-1.5 overflow-hidden">
                              <div className="bg-indigo-600 h-1.5 rounded-full transition-all" style={{ width: `${t.progress}%` }}></div>
                            </div>

                            {/* Quick status selector */}
                            <select
                              value={t.status}
                              onChange={(e) => updateTaskStatus(t.id, e.target.value)}
                              className={`text-xs p-1.5 rounded border focus:outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-300' : 'bg-gray-50 border-gray-200 text-gray-600'}`}
                            >
                              {STATUSES.map(st => <option key={st.name} value={st.name}>{st.name}</option>)}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* 2. LIST VIEW */}
            {view === 'list' && (
              <div className={`border rounded-xl overflow-hidden shadow-sm ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200'}`}>
                <table className="w-full text-left text-sm">
                  <thead className={`border-b ${isDarkMode ? 'bg-slate-900/50 border-slate-700 text-slate-400' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>
                    <tr>
                      <th className="p-3">Task Title</th>
                      <th className="p-3">Status</th>
                      <th className="p-3">Priority</th>
                      <th className="p-3">Assignee</th>
                      <th className="p-3">Due Date</th>
                      <th className="p-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200 dark:divide-slate-700">
                    {filteredTasks.map(t => (
                      <tr key={t.id} className="hover:bg-gray-50/50 dark:hover:bg-slate-700/50">
                        <td className="p-3 font-medium">{t.title}</td>
                        <td className="p-3">
                          <select
                            value={t.status}
                            onChange={(e) => updateTaskStatus(t.id, e.target.value)}
                            className="text-xs p-1 rounded font-medium border"
                          >
                            {STATUSES.map(st => <option key={st.name} value={st.name}>{st.name}</option>)}
                          </select>
                        </td>
                        <td className="p-3 text-xs font-semibold">{t.priority}</td>
                        <td className="p-3 text-xs">{t.assignee}</td>
                        <td className="p-3 text-xs text-gray-500">{t.dueDate}</td>
                        <td className="p-3 text-right">
                          <button onClick={() => deleteTask(t.id)} className="text-gray-400 hover:text-red-500">
                            <Icon className="w-4 h-4" name="trash"/>
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* 3. GANTT TIMELINE VIEW */}
            {view === 'timeline' && (
              <div className={`p-6 rounded-xl border flex flex-col gap-4 ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200'}`}>
                <h2 className="font-bold text-lg">Gantt Schedule Overview</h2>
                <div className="flex flex-col gap-3">
                  {filteredTasks.map(t => (
                    <div key={t.id} className="flex items-center gap-4 text-sm">
                      <span className="w-48 truncate font-medium">{t.title}</span>
                      <div className="flex-1 bg-gray-100 dark:bg-slate-700 h-8 rounded-lg relative overflow-hidden flex items-center px-3">
                        <div
                          className="absolute left-0 top-0 bottom-0 bg-indigo-500/30 border-l-4 border-indigo-600 rounded"
                          style={{ width: `${Math.max(t.progress, 15)}%` }}
                        ></div>
                        <span className="relative z-10 text-xs font-semibold">{t.dueDate} ({t.progress}%)</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. CALENDAR GRID VIEW */}
            {view === 'calendar' && (
              <div className={`p-6 rounded-xl border grid grid-cols-7 gap-2 text-center text-xs font-semibold ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200'}`}>
                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                  <div key={day} className="py-2 text-gray-400 uppercase">{day}</div>
                ))}
                {Array.from({ length: 31 }).map((_, i) => {
                  const dateStr = `2026-10-${(i + 1).toString().padStart(2, '0')}`;
                  const dayTasks = filteredTasks.filter(t => t.dueDate === dateStr);

                  return (
                    <div key={i} className={`min-h-[80px] p-2 border rounded-lg flex flex-col gap-1 items-start justify-start ${isDarkMode ? 'border-slate-700 bg-slate-900/40' : 'border-gray-100 bg-gray-50'}`}>
                      <span className="text-gray-400 font-bold">{i + 1}</span>
                      {dayTasks.map(t => (
                        <div key={t.id} className="w-full truncate text-[10px] bg-indigo-600 text-white rounded p-1 font-medium">
                          {t.title}
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
