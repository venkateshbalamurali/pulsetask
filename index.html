<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseTask Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; }
    .logo { width: 36px; height: 36px; background: linear-gradient(to top right, #4f46e5, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.25rem; color: #fff; }
    .title h1 { font-size: 1.125rem; font-weight: 700; }
    .title p { font-size: 0.75rem; color: #94a3b8; }
    .nav-bar { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; overflow-x: auto; }
    .tabs { display: flex; }
    .tab-btn { background: none; border: none; color: #94a3b8; padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; text-transform: capitalize; }
    .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; font-weight: 600; }
    .add-form { display: flex; gap: 0.5rem; padding: 0.5rem 0; }
    .add-form input { background-color: #0f172a; border: 1px solid #334155; color: #fff; padding: 0.375rem 0.75rem; border-radius: 6px; font-size: 0.875rem; outline: none; }
    .add-form button { background-color: #4f46e5; color: #fff; border: none; padding: 0.375rem 0.75rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
    .main-content { padding: 1.5rem; flex: 1; }
    .kanban-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
    .kanban-col { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .col-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; font-weight: 600; }
    .badge { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; }
    .badge-todo { background-color: #334155; color: #e2e8f0; }
    .badge-inprogress { background-color: #1e3a8a; color: #93c5fd; }
    .badge-stuck { background-color: #7f1d1d; color: #fca5a5; }
    .badge-done { background-color: #064e3b; color: #6ee7b7; }
    .task-card { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.875rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .task-title { font-size: 0.875rem; font-weight: 500; }
    .task-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; }
    .status-select { background-color: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 0.25rem; border-radius: 4px; font-size: 0.75rem; width: 100%; outline: none; }
    .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.75rem; float: right; }
    table { width: 100%; border-collapse: collapse; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; text-align: left; font-size: 0.875rem; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid #334155; }
    th { background-color: #0f172a; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo">P</div>
      <div class="title">
        <h1>PulseTask Workspace</h1>
        <p>Project & Task Management</p>
      </div>
    </div>
  </header>

  <div class="nav-bar">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchView('kanban')">Kanban Board</button>
      <button class="tab-btn" onclick="switchView('list')">List Table</button>
    </div>
    <form class="add-form" onsubmit="handleAddTask(event)">
      <input type="text" id="newTaskInput" placeholder="New task title..." required />
      <button type="submit">+ Add Task</button>
    </form>
  </div>

  <main class="main-content" id="appRoot"></main>

  <script>
    let tasks = JSON.parse(localStorage.getItem('pulsetask_vanilla')) || [
      { id: '1', title: 'Design Landing Page Wireframes', status: 'In Progress', tag: 'Design', dueDate: '2026-10-10' },
      { id: '2', title: 'Setup Database Schema', status: 'Done', tag: 'Backend', dueDate: '2026-10-04' },
      { id: '3', title: 'Integrate Gantt View', status: 'To Do', tag: 'Frontend', dueDate: '2026-10-18' },
      { id: '4', title: 'User Onboarding Flow', status: 'Stuck', tag: 'Marketing', dueDate: '2026-10-12' }
    ];

    let currentView = 'kanban';

    function saveTasks() {
      localStorage.setItem('pulsetask_vanilla', JSON.stringify(tasks));
      render();
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(view));
      });
      render();
    }

    function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('newTaskInput');
      if (!input.value.trim()) return;
      tasks.unshift({
        id: Date.now().toString(),
        title: input.value.trim(),
        status: 'To Do',
        tag: 'General',
        dueDate: new Date().toISOString().split('T')[0]
      });
      input.value = '';
      saveTasks();
    }

    function updateStatus(id, newStatus) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: newStatus } : t);
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function render() {
      const root = document.getElementById('appRoot');
      if (currentView === 'kanban') {
        const statuses = [
          { name: 'To Do', class: 'badge-todo' },
          { name: 'In Progress', class: 'badge-inprogress' },
          { name: 'Stuck', class: 'badge-stuck' },
          { name: 'Done', class: 'badge-done' }
        ];

        root.innerHTML = `<div class="kanban-grid">
          ${statuses.map(s => {
            const colTasks = tasks.filter(t => t.status === s.name);
            return `
              <div class="kanban-col">
                <div class="col-header">
                  <span class="badge ${s.class}">${s.name}</span>
                  <span style="font-size: 0.75rem; color: #94a3b8;">${colTasks.length}</span>
                </div>
                ${colTasks.map(t => `
                  <div class="task-card">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                      <div class="task-title">${t.title}</div>
                      <button class="delete-btn" onclick="deleteTask('${t.id}')">✕</button>
                    </div>
                    <div class="task-meta">
                      <span>${t.tag}</span>
                      <span>${t.dueDate}</span>
                    </div>
                    <select class="status-select" onchange="updateStatus('${t.id}', this.value)">
                      ${statuses.map(st => `<option value="${st.name}" ${st.name === t.status ? 'selected' : ''}>${st.name}</option>`).join('')}
                    </select>
                  </div>
                `).join('')}
              </div>
            `;
          }).join('')}
        </div>`;
      } else {
        root.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Tag</th>
                <th>Due Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${tasks.map(t => `
                <tr>
                  <td>${t.title}</td>
                  <td>${t.status}</td>
                  <td>${t.tag}</td>
                  <td>${t.dueDate}</td>
                  <td><button class="delete-btn" onclick="deleteTask('${t.id}')">Delete</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }
    }

    render();
  </script>
</body>
</html>
